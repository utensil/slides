name: Build and Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # PlantUML (via node-plantuml) shells out to `dot` + Java. Java is
      # preinstalled on the runner; graphviz is the only extra.
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz

      # Cache bun's package cache for fast warm installs. (Cacheless cold time
      # was validated separately to confirm it fits tangled's 5-min budget;
      # GitHub keeps the cache for everyday speed.)
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-revealmd-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: ${{ runner.os }}-bun-revealmd-

      - name: Install JS tools (bun)
        # reveal-md pinned: 6.x's template injects a mermaid script that --static
        # doesn't ship (404 → breaks rendering); pin so behavior can't drift.
        run: bun add --no-save reveal-md@6.1.4 mathjax-node-cli node-plantuml

      - name: Build deck (reveal-md, full preprocessor)
        run: |
          set -euo pipefail
          mkdir -p _site/ml
          ( cd ml && bunx reveal-md@6.1.4 --preprocessor js/preproc.js --static ../_site/ml ml.md )
          cp -r ml/css _site/ml/_assets/ 2>/dev/null || true
          cp -r ml/js  _site/ml/_assets/ 2>/dev/null || true
          cp -r ml/images _site/ml/ 2>/dev/null || true
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>utensil slides</title><meta http-equiv="refresh" content="0; url=ml/"><a href="ml/">slides &rarr;</a>' > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
